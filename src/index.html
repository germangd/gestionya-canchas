<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GestiónYa Canchas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <header class="marca">
        <div>
          <em>GestiónYa</em>
          <strong>Canchas</strong>
        </div>
      </header>
      <nav>
        <button type="button" class="nav-btn activo" data-vista="canchas">Canchas</button>
        <button type="button" class="nav-btn" data-vista="alquileres">Alquileres</button>
        <button type="button" class="nav-btn" data-vista="clientes">Clientes</button>
        <button type="button" class="nav-btn" data-vista="escuelita">Escuelita</button>
        <button type="button" class="nav-btn" data-vista="resumen">Resumen</button>
        <button type="button" class="nav-btn" data-vista="config">Configuración</button>
      </nav>
      <p class="nota">Los datos quedan en esta PC. Se puede usar sin internet.</p>
    </aside>
    <section class="lienzo" id="lienzo"></section>
    <aside class="panel" id="panel"></aside>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
